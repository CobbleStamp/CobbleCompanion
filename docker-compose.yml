services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cobble
    ports:
      - '5432:5432'
    volumes:
      # Bind-mount to ./data/postgres in the repo so the database survives
      # container/stack restarts and is visible on the host. Gitignored.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cobble']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    # App config (GOOGLE_CLIENT_ID, LLM_*, OPENROUTER_API_KEY) is loaded
    # straight from .env — env_file is NOT shadowed by stray host-shell exports,
    # unlike ${VAR} interpolation, so .env is the single source of truth.
    env_file:
      - .env
    environment:
      # Container-specific overrides (these win over .env): Postgres runs inside
      # the compose network, and the listen/app settings are fixed for docker.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cobble
      APP_URL: http://localhost:3001
      PORT: '3000'
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '3001:80'
    depends_on:
      - api

  # The always-on Discord worker (companion-discord.md). Reads DISCORD_SERVICE_*,
  # DISCORD_TOKEN_KEY from .env; reaches the api over the compose network. The
  # service credential it authenticates with is seeded into the DB by the api at
  # boot from SERVICE_REGISTRY_SEEDS (.env), so the worker comes up green on a
  # fresh stack and idles until a user saves a bot token in the web settings panel.
  discord:
    build:
      context: .
      dockerfile: Dockerfile
      target: discord
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-specific overrides: Postgres + the api are reached on the compose
      # network, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cobble
      DISCORD_WS_BASE_URL: ws://api:3000
      DISCORD_MINT_URL: http://api:3000/internal/discord/token
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
